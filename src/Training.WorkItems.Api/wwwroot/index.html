<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Items — Dev Client</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 14px;
            background: #f4f5f7;
            color: #172b4d;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #0052cc;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        header h1 { font-size: 16px; font-weight: 600; }

        #auth-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        aside {
            width: 290px;
            flex-shrink: 0;
            background: white;
            border-right: 1px solid #dfe1e6;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #42526e;
            margin-bottom: 3px;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #dfe1e6;
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
            color: #172b4d;
            background: white;
            margin-bottom: 8px;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #4c9aff;
            box-shadow: 0 0 0 2px rgba(76, 154, 255, 0.2);
        }

        textarea { resize: vertical; min-height: 56px; }

        button {
            padding: 6px 12px;
            background: #0052cc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        button:hover { background: #0065ff; }
        button:active { background: #0747a6; }

        .action-section {
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            overflow: hidden;
        }

        .action-header {
            padding: 7px 10px;
            background: #f4f5f7;
            border-bottom: 1px solid #dfe1e6;
            font-weight: 600;
            font-size: 12px;
            color: #42526e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .method {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 5px;
            border-radius: 3px;
            color: white;
            letter-spacing: 0.3px;
        }

        .method-get   { background: #00875a; }
        .method-post  { background: #0052cc; }
        .method-patch { background: #ff8b00; }

        .action-body { padding: 10px; }

        #response-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 14px;
            gap: 10px;
        }

        .response-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: white;
            border: 1px solid #dfe1e6;
            border-radius: 4px;
            font-size: 13px;
            flex-shrink: 0;
        }

        .status-badge {
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 12px;
        }

        .status-2xx { background: #e3fcef; color: #006644; }
        .status-4xx { background: #ffebe6; color: #bf2600; }
        .status-5xx { background: #ffebe6; color: #bf2600; }

        .response-url {
            color: #6b778c;
            font-family: monospace;
            font-size: 12px;
        }

        .response-body {
            flex: 1;
            overflow: auto;
            background: #1e1e1e;
            border-radius: 4px;
            padding: 16px;
        }

        pre {
            font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
            font-size: 13px;
            color: #d4d4d4;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0;
        }

        .placeholder {
            color: #6b778c;
            font-style: italic;
            padding: 40px;
            text-align: center;
        }

        .login-prompt {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 100%;
            color: #6b778c;
            text-align: center;
        }

        .login-prompt h2 { color: #172b4d; }

        a.btn {
            display: inline-block;
            padding: 8px 16px;
            background: #0052cc;
            color: white;
            border-radius: 3px;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
        }

        a.btn:hover { background: #0065ff; }

        .hint {
            font-size: 11px;
            color: #6b778c;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<header>
    <h1>Work Items — Dev Client</h1>
    <div id="auth-bar">
        <span id="auth-status">Checking...</span>
    </div>
</header>

<div class="main">
    <aside>

        <div class="action-section">
            <div class="action-header">
                <span class="method method-get">GET</span>
                List Work Items
            </div>
            <div class="action-body">
                <button onclick="listWorkItems()">Send Request</button>
            </div>
        </div>

        <div class="action-section">
            <div class="action-header">
                <span class="method method-post">POST</span>
                Create Work Item
            </div>
            <div class="action-body">
                <label>Title *</label>
                <input type="text" id="create-title" placeholder="e.g. Fix login bug" maxlength="120">
                <label>Description</label>
                <textarea id="create-desc" placeholder="Optional..." maxlength="4000"></textarea>
                <button onclick="createWorkItem()">Send Request</button>
                <p class="hint" id="last-created-hint"></p>
            </div>
        </div>

        <div class="action-section">
            <div class="action-header">
                <span class="method method-get">GET</span>
                Get Work Item by ID
            </div>
            <div class="action-body">
                <label>ID (GUID)</label>
                <input type="text" id="get-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                <button onclick="getWorkItem()">Send Request</button>
            </div>
        </div>

        <div class="action-section">
            <div class="action-header">
                <span class="method method-patch">PATCH</span>
                Change Status
            </div>
            <div class="action-body">
                <label>ID (GUID)</label>
                <input type="text" id="status-id" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">
                <label>New Status</label>
                <select id="status-value">
                    <option value="0">New</option>
                    <option value="1">InProgress</option>
                    <option value="2">Completed</option>
                    <option value="3">Closed</option>
                </select>
                <button onclick="changeStatus()">Send Request</button>
            </div>
        </div>

    </aside>

    <section id="response-panel">
        <div class="placeholder">Select an action on the left to send a request.</div>
    </section>
</div>

<script>
    async function checkAuth() {
        const statusEl = document.getElementById('auth-status');
        const authBar  = document.getElementById('auth-bar');

        try {
            const res = await fetch('/api/workitems', {
                credentials: 'include',
                redirect: 'manual'
            });

            if (res.type === 'opaqueredirect' || res.status === 401 || res.status === 403) {
                statusEl.textContent = 'Not signed in';
                const link = document.createElement('a');
                link.href = '/auth/start';
                link.className = 'btn';
                link.textContent = 'Sign In';
                authBar.appendChild(link);
                showLoginPrompt();
            } else {
                statusEl.textContent = 'Signed in';
            }
        } catch {
            statusEl.textContent = 'API unreachable';
        }
    }

    function showLoginPrompt() {
        document.getElementById('response-panel').innerHTML = `
            <div class="login-prompt">
                <h2>Not signed in</h2>
                <p>Sign in to interact with the API.</p>
                <a href="/auth/start" class="btn">Sign In</a>
            </div>
        `;
    }

    function showResponse(method, url, status, statusText, body) {
        const statusClass = status >= 500 ? 'status-5xx'
                          : status >= 400 ? 'status-4xx'
                          : 'status-2xx';

        const panel = document.getElementById('response-panel');
        panel.innerHTML = `
            <div class="response-meta">
                <span class="status-badge ${statusClass}">${status} ${statusText}</span>
                <span class="response-url">${method} ${url}</span>
            </div>
            <div class="response-body">
                <pre id="response-pre"></pre>
            </div>
        `;

        document.getElementById('response-pre').textContent =
            typeof body === 'string' ? body : JSON.stringify(body, null, 2);
    }

    function showError(method, url, message) {
        const panel = document.getElementById('response-panel');
        panel.innerHTML = `
            <div class="response-meta">
                <span class="status-badge status-5xx">Error</span>
                <span class="response-url">${method} ${url}</span>
            </div>
            <div class="response-body">
                <pre>${message}</pre>
            </div>
        `;
    }

    async function call(method, url, body) {
        const opts = {
            method,
            credentials: 'include',
            redirect: 'manual',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }
        };

        if (body !== undefined) {
            opts.body = JSON.stringify(body);
        }

        try {
            const res = await fetch(url, opts);

            if (res.type === 'opaqueredirect' || res.status === 401) {
                showLoginPrompt();
                return null;
            }

            const text = await res.text();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch { /* plain text */ }

            showResponse(method, url, res.status, res.statusText, parsed ?? text);
            return parsed;
        } catch (e) {
            showError(method, url, e.message);
            return null;
        }
    }

    async function listWorkItems() {
        await call('GET', '/api/workitems');
    }

    async function createWorkItem() {
        const title = document.getElementById('create-title').value.trim();
        const desc  = document.getElementById('create-desc').value.trim();

        if (!title) { alert('Title is required.'); return; }

        const body = { title };
        if (desc) body.description = desc;

        const result = await call('POST', '/api/workitems', body);

        if (result?.id) {
            document.getElementById('get-id').value    = result.id;
            document.getElementById('status-id').value = result.id;
            document.getElementById('last-created-hint').textContent = `ID copied to Get / Change Status fields.`;
        }
    }

    async function getWorkItem() {
        const id = document.getElementById('get-id').value.trim();
        if (!id) { alert('Enter a GUID.'); return; }
        await call('GET', `/api/workitems/${id}`);
    }

    async function changeStatus() {
        const id     = document.getElementById('status-id').value.trim();
        const status = parseInt(document.getElementById('status-value').value, 10);
        if (!id) { alert('Enter a GUID.'); return; }
        await call('PATCH', `/api/workitems/${id}/status`, { status });
    }

    checkAuth();
</script>

</body>
</html>
